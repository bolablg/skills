name: Validate Skills

on:
  push:
    branches:
      - main
      - staging
      - 'dev-*'
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Run installer tests
        run: npm test

      - name: Inspect published package contents
        run: npm run pack:check
