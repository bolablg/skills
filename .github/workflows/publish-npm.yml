name: Publish npm package

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Do not cancel an in-progress release: every merged, newly-versioned package
# should have a chance to reach the npm registry in order.
concurrency:
  group: npm-publish-main
  cancel-in-progress: false

# npm trusted publishing exchanges this GitHub Actions identity for a
# short-lived npm credential. No npm access token is stored in this repository.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @bolablg/skills
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Run installer tests
        run: npm test

      - name: Inspect package contents
        run: npm run pack:check

      - name: Read package version
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already public
        id: registry
        env:
          PACKAGE_NAME: '@bolablg/skills'
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish new version to npm
        if: steps.registry.outputs.published != 'true'
        run: npm publish --access public

      - name: Report already-published version
        if: steps.registry.outputs.published == 'true'
        run: echo "@bolablg/skills@${{ steps.package.outputs.version }} is already published; nothing to do."
